name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from a clean checkout
        run: pip install -e ".[dev,ui]"
      - name: Build the database
        run: python -m result_explainer build-db
      - name: Validate every approved question
        run: python -m result_explainer check
      - name: Run tests
        run: pytest -q
